<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Doge Tap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial;
            color: white;
            user-select: none;
            overflow: hidden;
        }
        .balance {
            font-size: 42px;
            font-weight: bold;
            color: #f0b90b;
            margin-bottom: 20px;
        }
        .energy-container {
            width: 200px;
            height: 15px;
            background: #333;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #f0b90b, #ffd700);
            width: 100%;
            transition: width 0.3s;
        }
        .energy-text {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .doge-img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            cursor: pointer;
            border: 5px solid #f0b90b;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.6);
        }
        .doge-img:active {
            transform: scale(0.85);
        }
        .info {
            margin-top: 20px;
            color: #888;
        }
        .floating-score {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-weight: bold;
            font-size: 24px;
            color: #f0b90b;
            text-shadow: 0 0 10px rgba(240, 185, 11, 0.8);
            animation: floatUp 0.9s ease-out forwards;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px);
            }
        }
    </style>
</head>
<body>
    <div class="balance">💰 <span id="score">0</span> DOGE</div>
    <div class="energy-text">⚡ Энергия: <span id="energyCount">100</span>/100</div>
    <div class="energy-container">
        <div class="energy-fill" id="energyFill"></div>
    </div>
    <img src="https://i.ibb.co/Ph1LmJX/doge.png" class="doge-img" id="doge" alt="Doge">
    <div class="info">Тапай по Doge!</div>

    <script>
        let score = 0;
        let energy = 100;
        const maxEnergy = 100;
        
        const scoreElement = document.getElementById('score');
        const doge = document.getElementById('doge');
        const energyFill = document.getElementById('energyFill');
        const energyCount = document.getElementById('energyCount');
        
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // ЗАГРУЗКА СОХРАНЁННЫХ МОНЕТ
        const savedScore = localStorage.getItem('dogeScore');
        if (savedScore) {
            score = parseInt(savedScore);
            scoreElement.textContent = score;
        }
        
        // СОХРАНЕНИЕ МОНЕТ
        function saveScore() {
            localStorage.setItem('dogeScore', score);
        }
        
        // Восстановление энергии
        setInterval(() => {
            if (energy < maxEnergy) {
                energy++;
                updateEnergy();
            }
        }, 3000);
        
        function updateEnergy() {
            energyFill.style.width = (energy / maxEnergy * 100) + '%';
            energyCount.textContent = energy;
        }
        
        // Тап по Doge
        doge.addEventListener('click', (e) => {
            if (energy <= 0) {
                alert('Энергия закончилась! Подожди немного ⚡');
                return;
            }
            
            score++;
            energy--;
            
            scoreElement.textContent = score;
            updateEnergy();
            saveScore();
            
            createFloatingScore(e.clientX, e.clientY);
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
        
        function createFloatingScore(x, y) {
            const plusOne = document.createElement('div');
            plusOne.textContent = '+1';
            plusOne.className = 'floating-score';
            plusOne.style.left = (x + Math.random() * 20 - 10) + 'px';
            plusOne.style.top = (y - 20) + 'px';
            document.body.appendChild(plusOne);
            
            setTimeout(() => plusOne.remove(), 900);
        }
        
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
