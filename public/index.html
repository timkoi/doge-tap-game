<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Doge Click</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --gold: #f0b90b;
            --bg-dark: #0f1220;
            --bg-card: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --purple: #9b59b6;
            --red: #e74c3c;
            --green: #2ecc71;
        }
        body {
            background: var(--bg-dark);
            font-family: 'Segoe UI', 'Arial', sans-serif;
            color: var(--text-primary);
            user-select: none;
            overflow: hidden;
            touch-action: manipulation;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .game-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(15, 18, 32, 0.8);
            border-bottom: 1px solid var(--border-glass);
        }
        .balance-display {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(240, 185, 11, 0.1);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(240, 185, 11, 0.2);
        }
        .coin-icon-small {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
        .balance-text {
            font-size: 22px;
            font-weight: bold;
            color: var(--gold);
        }
        .bones-display {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(155, 89, 182, 0.1);
            padding: 6px 12px;
            border-radius: 50px;
            border: 1px solid rgba(155, 89, 182, 0.2);
        }
        .bone-icon {
            font-size: 18px;
        }
        .bones-text {
            font-size: 16px;
            font-weight: bold;
            color: var(--purple);
        }
        .energy-section {
            padding: 10px 20px;
        }
        .energy-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .energy-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .energy-value {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: bold;
        }
        .energy-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            overflow: hidden;
        }
        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #f0b90b, #ffd700);
            border-radius: 50px;
            transition: width 0.5s;
        }
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .evolution-badge {
            font-size: 14px;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 5px 15px;
            border-radius: 50px;
            border: 1px solid var(--border-glass);
            margin-bottom: 15px;
        }
        .doge-coin {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            cursor: pointer;
            border: 4px solid rgba(240, 185, 11, 0.6);
            box-shadow: 0 0 60px rgba(240, 185, 11, 0.3);
            transition: transform 0.08s;
            pointer-events: auto;
            position: relative;
            z-index: 10;
        }
        .doge-coin:active {
            transform: scale(0.85);
        }
        .boost-badge {
            position: absolute;
            top: 50px;
            right: 20px;
            background: var(--green);
            color: white;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            display: none;
        }
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: rgba(15, 18, 32, 0.9);
            border-top: 1px solid var(--border-glass);
            gap: 5px;
        }
        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 5px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 12px;
            pointer-events: auto;
            position: relative;
            z-index: 100;
        }
        .nav-btn:active {
            transform: scale(0.9);
            background: var(--bg-card);
        }
        .nav-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
        }
        .nav-label {
            font-size: 9px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-content {
            background: rgba(22, 26, 44, 0.95);
            border: 1px solid var(--border-glass);
            border-radius: 25px;
            padding: 25px;
            max-width: 400px;
            margin: 20px auto;
        }
        .modal-title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: var(--gold);
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .card-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
        }
        .card-info {
            flex: 1;
        }
        .card-name {
            font-weight: bold;
            font-size: 15px;
        }
        .card-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 3px;
        }
        .btn-buy {
            background: linear-gradient(135deg, #f0b90b, #d4a30b);
            color: #1a1a2e;
            border: none;
            padding: 10px 15px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            font-size: 12px;
            pointer-events: auto;
            position: relative;
            z-index: 100;
        }
        .btn-buy:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
        }
        .btn-close {
            background: rgba(231, 76, 60, 0.2);
            color: var(--red);
            border: none;
            padding: 12px;
            border-radius: 15px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            pointer-events: auto;
            position: relative;
            z-index: 100;
        }
        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .leaderboard-rank {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background: rgba(240, 185, 11, 0.15);
            color: var(--gold);
        }
        .leaderboard-name {
            flex: 1;
            font-weight: bold;
            font-size: 14px;
        }
        .leaderboard-score {
            color: var(--gold);
            font-weight: bold;
        }
        .floating-score {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-weight: bold;
            font-size: 26px;
            color: var(--gold);
            animation: floatUp 0.9s forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }
        .wheel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }
        .wheel {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 6px solid rgba(240, 185, 11, 0.6);
            background: conic-gradient(#f0b90b 0deg 45deg, #e74c3c 45deg 90deg, #2ecc71 90deg 135deg, #3498db 135deg 180deg, #9b59b6 180deg 225deg, #e67e22 225deg 270deg, #1abc9c 270deg 315deg, #f0b90b 315deg 360deg);
            cursor: pointer;
            transition: transform 4s;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            position: relative;
            z-index: 100;
        }
        .wheel-center {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wheel-center-img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
        }
        .wheel-result {
            text-align: center;
            font-size: 18px;
            color: var(--gold);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="top-bar">
            <div class="balance-display">
                <img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="coin-icon-small" alt="DOGE">
                <span class="balance-text"><span id="score">0</span> DOGE</span>
            </div>
            <div class="bones-display">
                <span class="bone-icon">🦴</span>
                <span class="bones-text"><span id="bones">0</span> BONES</span>
            </div>
        </div>
        <div class="energy-section">
            <div class="energy-header">
                <span class="energy-label">Энергия</span>
                <span class="energy-value"><span id="energyCount">100</span>/<span id="maxEnergyText">100</span></span>
            </div>
            <div class="energy-bar">
                <div class="energy-fill" id="energyFill"></div>
            </div>
        </div>
        <div class="main-area">
            <div class="evolution-badge" id="evolutionBadge">Doge</div>
            <img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="doge-coin" id="doge" alt="Doge">
            <div class="boost-badge" id="boostBadge">x2 BOOST</div>
        </div>
        <div class="bottom-nav">
            <button class="nav-btn" id="shopBtn"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="nav-icon"><span class="nav-label">Магазин</span></button>
            <button class="nav-btn" id="questBtn"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="nav-icon"><span class="nav-label">Задания</span></button>
            <button class="nav-btn" id="leaderboardBtn"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="nav-icon"><span class="nav-label">Лидеры</span></button>
            <button class="nav-btn" id="wheelBtn"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="nav-icon"><span class="nav-label">Колесо</span></button>
            <button class="nav-btn" id="caseBtn"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="nav-icon"><span class="nav-label">Кейсы</span></button>
        </div>
    </div>

    <div class="modal" id="shopModal">
        <div class="modal-content">
            <div class="modal-title">Магазин</div>
            <div class="card"><div class="card-row">
                <img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="card-icon">
                <div class="card-info"><div class="card-name">Множитель тапа</div><div class="card-desc">Ур. <span id="tapLevel">0</span></div></div>
                <button class="btn-buy" id="buyTap">100 DOGE</button>
            </div></div>
            <div class="card"><div class="card-row">
                <img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="card-icon">
                <div class="card-info"><div class="card-name">Энергия</div><div class="card-desc">Ур. <span id="energyLevel">0</span></div></div>
                <button class="btn-buy" id="buyEnergy">150 DOGE</button>
            </div></div>
            <div class="card"><div class="card-row">
                <img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="card-icon">
                <div class="card-info"><div class="card-name">Автокликер</div><div class="card-desc">Ур. <span id="autoLevel">0</span></div></div>
                <button class="btn-buy" id="buyAuto">200 DOGE</button>
            </div></div>
            <button class="btn-close" id="closeShop">Закрыть</button>
        </div>
    </div>

    <div class="modal" id="questModal">
        <div class="modal-content">
            <div class="modal-title">Задания</div>
            <div id="questList"></div>
            <button class="btn-close" id="closeQuest">Закрыть</button>
        </div>
    </div>

    <div class="modal" id="leaderboardModal">
        <div class="modal-content">
            <div class="modal-title">Лидеры</div>
            <div id="leaderboardList"></div>
            <button class="btn-close" id="closeLeaderboard">Закрыть</button>
        </div>
    </div>

    <div class="modal" id="wheelModal">
        <div class="modal-content">
            <div class="modal-title">Колесо</div>
            <div class="wheel-container">
                <div class="wheel" id="wheel"><div class="wheel-center"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="wheel-center-img"></div></div>
                <div class="wheel-result" id="wheelPrize">Крути!</div>
            </div>
            <button class="btn-close" id="closeWheel">Закрыть</button>
        </div>
    </div>

    <div class="modal" id="caseModal">
        <div class="modal-content">
            <div class="modal-title">Кейсы</div>
            <div class="card" id="caseCommon"><div class="card-row"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="card-icon"><div class="card-info"><div class="card-name">Обычный</div><div class="card-desc">100 DOGE</div></div></div></div>
            <div class="card" id="caseRare"><div class="card-row"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="card-icon"><div class="card-info"><div class="card-name">Редкий</div><div class="card-desc">500 DOGE</div></div></div></div>
            <div class="card" id="caseEpic"><div class="card-row"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="card-icon"><div class="card-info"><div class="card-name">Эпический</div><div class="card-desc">2000 DOGE</div></div></div></div>
            <button class="btn-close" id="closeCase">Закрыть</button>
        </div>
    </div>

    <script>
        // ==================== ПЕРЕМЕННЫЕ ====================
        let score = 0;
        let bones = 0;
        let energy = 100;
        let maxEnergy = 100;
        let tapLevel = 0;
        let energyLevel = 0;
        let autoLevel = 0;
        let evolution = 0;
        let boostActive = false;
        let streak = 0;
        let lastClaimDate = '';
        let tapQuestCount = 0;
        
        const evolutions = ['Baby Doge', 'Doge', 'Golden Doge', 'King Doge', 'Space Doge', 'Moon Doge', 'Diamond Doge'];
        const evolutionCosts = [0, 1000, 5000, 20000, 100000, 500000, 1000000];
        const evolutionBones = [0, 5, 20, 50, 100, 200, 500];
        
        // ==================== DOM ====================
        const scoreElement = document.getElementById('score');
        const bonesElement = document.getElementById('bones');
        const doge = document.getElementById('doge');
        const energyFill = document.getElementById('energyFill');
        const energyCount = document.getElementById('energyCount');
        const maxEnergyText = document.getElementById('maxEnergyText');
        const boostBadge = document.getElementById('boostBadge');
        const evolutionBadge = document.getElementById('evolutionBadge');
        const tapLevelEl = document.getElementById('tapLevel');
        const energyLevelEl = document.getElementById('energyLevel');
        const autoLevelEl = document.getElementById('autoLevel');
        
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const userId = tg.initDataUnsafe?.user?.id || 'anonymous';
        const username = tg.initDataUnsafe?.user?.username || 'Player';
        
        // ==================== ЗАГРУЗКА ====================
        score = parseInt(localStorage.getItem('dogeScore') || '0');
        bones = parseInt(localStorage.getItem('bones') || '0');
        tapLevel = parseInt(localStorage.getItem('tapLevel') || '0');
        energyLevel = parseInt(localStorage.getItem('energyLevel') || '0');
        autoLevel = parseInt(localStorage.getItem('autoLevel') || '0');
        evolution = parseInt(localStorage.getItem('evolution') || '0');
        maxEnergy = 100 + energyLevel * 50;
        energy = parseInt(localStorage.getItem('energy') || String(maxEnergy));
        if (energy > maxEnergy) energy = maxEnergy;
        streak = parseInt(localStorage.getItem('streak') || '0');
        lastClaimDate = localStorage.getItem('lastClaimDate') || '';
        tapQuestCount = parseInt(localStorage.getItem('tapQuestCount') || '0');
        
        // Сброс квестов при новом дне
        const today = new Date().toDateString();
        const questDate = localStorage.getItem('questDate');
        if (questDate !== today) {
            tapQuestCount = 0;
            localStorage.setItem('tapQuestCount', '0');
            localStorage.setItem('questDate', today);
        }
        
        scoreElement.textContent = score;
        bonesElement.textContent = bones;
        updateUI();
        sendToServer();
        
        // ==================== ФУНКЦИИ ====================
        function saveGame() {
            localStorage.setItem('dogeScore', score);
            localStorage.setItem('bones', bones);
            localStorage.setItem('tapLevel', tapLevel);
            localStorage.setItem('energyLevel', energyLevel);
            localStorage.setItem('autoLevel', autoLevel);
            localStorage.setItem('evolution', evolution);
            localStorage.setItem('energy', energy);
            localStorage.setItem('streak', streak);
            localStorage.setItem('lastClaimDate', lastClaimDate);
            localStorage.setItem('tapQuestCount', tapQuestCount);
        }
        
        function sendToServer() {
            fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, username, score, bones, energy, tapLevel, energyLevel, autoLevel, evolution })
            }).catch(err => console.log('Server error:', err));
        }
        
        function updateUI() {
            energyFill.style.width = (energy / maxEnergy * 100) + '%';
            energyCount.textContent = energy;
            maxEnergyText.textContent = maxEnergy;
            bonesElement.textContent = bones;
            tapLevelEl.textContent = tapLevel;
            energyLevelEl.textContent = energyLevel;
            autoLevelEl.textContent = autoLevel;
            evolutionBadge.textContent = evolutions[evolution] || 'Doge';
            updateButtons();
        }
        
        function updateButtons() {
            buyTap.disabled = score < Math.floor(100 * Math.pow(1.15, tapLevel));
            buyTap.textContent = Math.floor(100 * Math.pow(1.15, tapLevel)) + ' DOGE';
            buyEnergy.disabled = score < Math.floor(150 * Math.pow(1.15, energyLevel));
            buyEnergy.textContent = Math.floor(150 * Math.pow(1.15, energyLevel)) + ' DOGE';
            buyAuto.disabled = score < Math.floor(200 * Math.pow(1.15, autoLevel));
            buyAuto.textContent = Math.floor(200 * Math.pow(1.15, autoLevel)) + ' DOGE';
        }
        
        function createFloatingScore(x, y, text) {
            const plus = document.createElement('div');
            plus.textContent = text;
            plus.className = 'floating-score';
            plus.style.left = (x + Math.random() * 20 - 10) + 'px';
            plus.style.top = (y - 20) + 'px';
            document.body.appendChild(plus);
            setTimeout(() => plus.remove(), 900);
        }
        
        // ==================== ТАП ====================
        doge.addEventListener('click', (e) => {
            if (energy <= 0) return;
            
            let gain = 1 + tapLevel;
            if (boostActive) gain *= 2;
            score += gain;
            energy--;
            tapQuestCount++;
            
            scoreElement.textContent = score;
            updateUI();
            saveGame();
            
            createFloatingScore(e.clientX, e.clientY, '+' + gain);
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });
        
        // ==================== ЭНЕРГИЯ ====================
        setInterval(() => {
            if (energy < maxEnergy) {
                energy++;
                updateUI();
                saveGame();
            }
        }, 3000);
        
        // ==================== АВТОКЛИКЕР ====================
        setInterval(() => {
            if (autoLevel > 0) {
                let gain = autoLevel;
                if (boostActive) gain *= 2;
                score += gain;
                scoreElement.textContent = score;
                saveGame();
            }
        }, 1000);
        
        // ==================== СЕРВЕР ====================
        setInterval(() => {
            sendToServer();
        }, 30000);
        
        // ==================== МОДАЛЬНЫЕ ОКНА ====================
        function openModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        document.getElementById('shopBtn').addEventListener('click', () => { openModal('shopModal'); updateButtons(); });
        document.getElementById('closeShop').addEventListener('click', () => closeModal('shopModal'));
        
        document.getElementById('questBtn').addEventListener('click', () => { openModal('questModal'); showQuests(); });
        document.getElementById('closeQuest').addEventListener('click', () => closeModal('questModal'));
        
        document.getElementById('leaderboardBtn').addEventListener('click', () => { openModal('leaderboardModal'); loadLeaderboard(); });
        document.getElementById('closeLeaderboard').addEventListener('click', () => closeModal('leaderboardModal'));
        
        document.getElementById('wheelBtn').addEventListener('click', () => { openModal('wheelModal'); checkWheel(); });
        document.getElementById('closeWheel').addEventListener('click', () => closeModal('wheelModal'));
        
        document.getElementById('caseBtn').addEventListener('click', () => openModal('caseModal'));
        document.getElementById('closeCase').addEventListener('click', () => closeModal('caseModal'));
        
        // ==================== ПОКУПКИ ====================
        document.getElementById('buyTap').addEventListener('click', () => {
            const cost = Math.floor(100 * Math.pow(1.15, tapLevel));
            if (score >= cost) {
                score -= cost;
                tapLevel++;
                scoreElement.textContent = score;
                saveGame();
                sendToServer();
                updateUI();
            }
        });
        
        document.getElementById('buyEnergy').addEventListener('click', () => {
            const cost = Math.floor(150 * Math.pow(1.15, energyLevel));
            if (score >= cost) {
                score -= cost;
                energyLevel++;
                maxEnergy = 100 + energyLevel * 50;
                energy = maxEnergy;
                scoreElement.textContent = score;
                saveGame();
                sendToServer();
                updateUI();
            }
        });
        
        document.getElementById('buyAuto').addEventListener('click', () => {
            const cost = Math.floor(200 * Math.pow(1.15, autoLevel));
            if (score >= cost) {
                score -= cost;
                autoLevel++;
                scoreElement.textContent = score;
                saveGame();
                sendToServer();
                updateUI();
            }
        });
        
        // ==================== КВЕСТЫ ====================
        const quests = [
            { id: 'tap_100', name: 'Сделай 100 тапов', reward: 50, check: () => tapQuestCount >= 100, progress: () => Math.min(tapQuestCount, 100) },
            { id: 'tap_500', name: 'Сделай 500 тапов', reward: 100, check: () => tapQuestCount >= 500, progress: () => Math.min(tapQuestCount, 500) },
            { id: 'buy_1', name: 'Купи улучшение', reward: 75, check: () => tapLevel + energyLevel + autoLevel >= 1, progress: () => Math.min(tapLevel + energyLevel + autoLevel, 1) }
        ];
        
        function showQuests() {
            const list = document.getElementById('questList');
            list.innerHTML = '';
            const doneQuests = JSON.parse(localStorage.getItem('doneQuests') || '{"items":{}}');
            
            quests.forEach(q => {
                const isDone = doneQuests.items[q.id];
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-row">
                        <div class="card-info">
                            <div class="card-name">${q.name}</div>
                            <div class="card-desc">Награда: ${q.reward} DOGE</div>
                        </div>
                        ${isDone ? '<span style="color:#2ecc71;font-weight:bold;">✅</span>' : `<button class="btn-buy" id="quest_${q.id}">Выполнить</button>`}
                    </div>
                `;
                list.appendChild(card);
                
                if (!isDone) {
                    const btn = document.getElementById('quest_' + q.id);
                    btn.addEventListener('click', () => {
                        if (!q.check()) {
                            alert('Задание ещё не выполнено! Прогресс: ' + q.progress());
                            return;
                        }
                        doneQuests.items[q.id] = true;
                        localStorage.setItem('doneQuests', JSON.stringify(doneQuests));
                        score += q.reward;
                        if (Math.random() < 0.2) bones++;
                        scoreElement.textContent = score;
                        updateUI();
                        saveGame();
                        showQuests();
                    });
                }
            });
        }
        
        // ==================== КОЛЕСО ====================
        const prizes = [50, 100, 250, 500, 1000, 2500, 5000, 10000];
        let wheelSpinning = false;
        
        document.getElementById('wheel').addEventListener('click', () => {
            if (wheelSpinning) return;
            const lastWheelDate = localStorage.getItem('lastWheelDate');
            if (lastWheelDate === today) {
                alert('Колесо можно крутить раз в день!');
                return;
            }
            wheelSpinning = true;
            const rotations = 5 + Math.random() * 5;
            document.getElementById('wheel').style.transform = 'rotate(' + rotations * 360 + 'deg)';
            const prize = prizes[Math.floor(Math.random() * prizes.length)];
            setTimeout(() => {
                score += prize;
                scoreElement.textContent = score;
                saveGame();
                localStorage.setItem('lastWheelDate', today);
                document.getElementById('wheelPrize').textContent = 'Выигрыш: ' + prize + ' DOGE!';
                wheelSpinning = false;
                document.getElementById('wheel').style.transform = 'rotate(0deg)';
            }, 4000);
        });
        
        function checkWheel() {
            const lastWheelDate = localStorage.getItem('lastWheelDate');
            document.getElementById('wheelPrize').textContent = lastWheelDate === today ? 'Уже крутил сегодня!' : 'Крути раз в день!';
        }
        
        // ==================== КЕЙСЫ ====================
        document.getElementById('caseCommon').addEventListener('click', () => openCase(100, [30, 50, 80, 120, 200]));
        document.getElementById('caseRare').addEventListener('click', () => openCase(500, [150, 300, 500, 800, 1200]));
        document.getElementById('caseEpic').addEventListener('click', () => openCase(2000, [500, 1000, 1800, 3000, 5000]));
        
        function openCase(price, prizes) {
            if (score < price) {
                alert('Недостаточно DOGE!');
                return;
            }
            score -= price;
            const prize = prizes[Math.floor(Math.random() * prizes.length)];
            score += prize;
            if (Math.random() < 0.1) bones++;
            scoreElement.textContent = score;
            saveGame();
            localStorage.setItem('lastCaseDate', today);
            alert('Вы выиграли ' + prize + ' DOGE!');
        }
        
        // ==================== ЛИДЕРБОРД ====================
        function loadLeaderboard() {
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px;">Загрузка...</div>';
            fetch('/api/leaderboard')
                .then(res => res.json())
                .then(data => {
                    list.innerHTML = '';
                    if (data.length === 0) {
                        list.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px;">Пока никого нет!</div>';
                        return;
                    }
                    data.forEach((player, index) => {
                        const div = document.createElement('div');
                        div.className = 'leaderboard-item';
                        div.innerHTML = `
                            <span class="leaderboard-rank">#${index + 1}</span>
                            <span class="leaderboard-name">${player.username}</span>
                            <span class="leaderboard-score">${player.score} DOGE</span>
                        `;
                        list.appendChild(div);
                    });
                })
                .catch(err => {
                    list.innerHTML = '<div style="text-align:center;color:#e74c3c;padding:20px;">Ошибка</div>';
                });
        }
    </script>
</body>
</html>
