<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DOGE Click</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --gold: #f0b90b;
            --bg-dark: #0f1220;
            --bg-card: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --purple: #9b59b6;
            --red: #e74c3c;
            --green: #2ecc71;
        }
        body {
            background: var(--bg-dark);
            font-family: 'Segoe UI', 'Arial', sans-serif;
            color: var(--text-primary);
            user-select: none;
            overflow: hidden;
            touch-action: manipulation;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* ==================== ЭКРАН ЗАГРУЗКИ ==================== */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-dark);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
            opacity: 1;
        }
        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-doge {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            animation: dogeSpin 2s linear infinite, dogeGlow 2s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(240, 185, 11, 0.4);
        }
        @keyframes dogeSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes dogeGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(240, 185, 11, 0.3); }
            50% { box-shadow: 0 0 60px rgba(240, 185, 11, 0.7); }
        }
        .loading-title {
            margin-top: 25px;
            font-size: 28px;
            font-weight: bold;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(240, 185, 11, 0.5);
            letter-spacing: 1px;
        }
        .loading-subtitle {
            margin-top: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }
        
        /* ==================== ИГРОВОЙ ИНТЕРФЕЙС ==================== */
        .game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .game-container.visible {
            opacity: 1;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: rgba(15, 18, 32, 0.8);
            border-bottom: 1px solid var(--border-glass);
            gap: 8px;
        }
        .balance-display {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(240, 185, 11, 0.1);
            padding: 6px 12px;
            border-radius: 50px;
            border: 1px solid rgba(240, 185, 11, 0.2);
            flex-shrink: 0;
        }
        .coin-icon-small {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }
        .balance-text {
            font-size: 16px;
            font-weight: bold;
            color: var(--gold);
        }
        .bones-display {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(155, 89, 182, 0.1);
            padding: 6px 12px;
            border-radius: 50px;
            border: 1px solid rgba(155, 89, 182, 0.2);
            flex-shrink: 0;
        }
        .bones-text {
            font-size: 13px;
            font-weight: bold;
            color: var(--purple);
        }
        
        /* Telegram кнопка */
        .telegram-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(74, 158, 255, 0.15);
            border: 1px solid rgba(74, 158, 255, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s;
            pointer-events: auto;
            position: relative;
            z-index: 100;
        }
        .telegram-btn:active {
            transform: scale(0.85);
            background: rgba(74, 158, 255, 0.3);
        }
        .telegram-btn svg {
            width: 18px;
            height: 18px;
            fill: #4a9eff;
        }
        
        .energy-section {
            padding: 8px 15px;
        }
        .energy-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .energy-label {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .energy-value {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: bold;
        }
        .energy-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            overflow: hidden;
        }
        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #f0b90b, #ffd700);
            border-radius: 50px;
            transition: width 0.5s;
        }
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .evolution-badge {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 4px 12px;
            border-radius: 50px;
            border: 1px solid var(--border-glass);
            margin-bottom: 10px;
        }
        .doge-coin {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            cursor: pointer;
            border: 4px solid rgba(240, 185, 11, 0.6);
            box-shadow: 0 0 60px rgba(240, 185, 11, 0.3);
            transition: transform 0.08s;
            pointer-events: auto;
            position: relative;
            z-index: 10;
        }
        .doge-coin:active {
            transform: scale(0.85);
        }
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 8px;
            background: rgba(15, 18, 32, 0.9);
            border-top: 1px solid var(--border-glass);
            gap: 5px;
        }
        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 3px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 12px;
            pointer-events: auto;
            position: relative;
            z-index: 100;
        }
        .nav-btn:active {
            transform: scale(0.9);
        }
        .nav-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
        }
        .nav-label {
            font-size: 8px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            overflow-y: auto;
            padding: 15px;
        }
        .modal-content {
            background: rgba(22, 26, 44, 0.95);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 20px;
            max-width: 400px;
            margin: 15px auto;
        }
        .modal-title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            color: var(--gold);
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .card-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .card-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
        }
        .card-info {
            flex: 1;
        }
        .card-name {
            font-weight: bold;
            font-size: 14px;
        }
        .card-desc {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .btn-buy {
            background: linear-gradient(135deg, #f0b90b, #d4a30b);
            color: #1a1a2e;
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            font-size: 11px;
            pointer-events: auto;
            position: relative;
            z-index: 100;
        }
        .btn-buy:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
        }
        .btn-close {
            background: rgba(231, 76, 60, 0.2);
            color: var(--red);
            border: none;
            padding: 10px;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            pointer-events: auto;
            position: relative;
            z-index: 100;
        }
        .floating-score {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-weight: bold;
            font-size: 24px;
            color: var(--gold);
            animation: floatUp 0.9s forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-80px); }
        }
    </style>
</head>
<body>
    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="loadingScreen">
        <img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="loading-doge" alt="Doge">
        <div class="loading-title">DOGE CLICK</div>
        <div class="loading-subtitle">by ???coiner</div>
    </div>

    <!-- ИГРА -->
    <div class="game-container" id="gameContainer">
        <div class="top-bar">
            <div class="balance-display">
                <img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="coin-icon-small" alt="DOGE">
                <span class="balance-text"><span id="score">0</span> DOGE</span>
            </div>
            <div class="bones-display">
                <span>🦴</span>
                <span class="bones-text"><span id="bones">0</span></span>
            </div>
            <button class="telegram-btn" id="telegramBtn">
                <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
            </button>
        </div>
        <div class="energy-section">
            <div class="energy-header">
                <span class="energy-label">Энергия</span>
                <span class="energy-value"><span id="energyCount">100</span>/<span id="maxEnergyText">100</span></span>
            </div>
            <div class="energy-bar">
                <div class="energy-fill" id="energyFill"></div>
            </div>
        </div>
        <div class="main-area">
            <div class="evolution-badge" id="evolutionBadge">Doge</div>
            <img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="doge-coin" id="doge" alt="Doge">
        </div>
        <div class="bottom-nav">
            <button class="nav-btn" id="shopBtn"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="nav-icon"><span class="nav-label">Магазин</span></button>
            <button class="nav-btn" id="leaderboardBtn"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="nav-icon"><span class="nav-label">Лидеры</span></button>
            <button class="nav-btn" id="caseBtn"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="nav-icon"><span class="nav-label">Кейсы</span></button>
            <button class="nav-btn" id="inventoryBtn"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="nav-icon"><span class="nav-label">Инвентарь</span></button>
        </div>
    </div>

    <div class="modal" id="shopModal">
        <div class="modal-content">
            <div class="modal-title">Магазин</div>
            <div class="card"><div class="card-row">
                <img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="card-icon">
                <div class="card-info"><div class="card-name">Множитель тапа</div><div class="card-desc">Ур. <span id="tapLevel">0</span></div></div>
                <button class="btn-buy" id="buyTap">100 DOGE</button>
            </div></div>
            <div class="card"><div class="card-row">
                <img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="card-icon">
                <div class="card-info"><div class="card-name">Энергия</div><div class="card-desc">Ур. <span id="energyLevel">0</span></div></div>
                <button class="btn-buy" id="buyEnergy">150 DOGE</button>
            </div></div>
            <div class="card"><div class="card-row">
                <img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="card-icon">
                <div class="card-info"><div class="card-name">Автокликер</div><div class="card-desc">Ур. <span id="autoLevel">0</span></div></div>
                <button class="btn-buy" id="buyAuto">200 DOGE</button>
            </div></div>
            <button class="btn-close" id="closeShop">Закрыть</button>
        </div>
    </div>

    <div class="modal" id="leaderboardModal">
        <div class="modal-content">
            <div class="modal-title">Лидеры</div>
            <div id="leaderboardList"></div>
            <button class="btn-close" id="closeLeaderboard">Закрыть</button>
        </div>
    </div>

    <div class="modal" id="caseModal">
        <div class="modal-content">
            <div class="modal-title">Кейсы</div>
            <div class="card" id="caseCommon"><div class="card-row"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="card-icon"><div class="card-info"><div class="card-name">Обычный</div><div class="card-desc">100 DOGE</div></div></div></div>
            <div class="card" id="caseRare"><div class="card-row"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="card-icon"><div class="card-info"><div class="card-name">Редкий</div><div class="card-desc">500 DOGE</div></div></div></div>
            <div class="card" id="caseEpic"><div class="card-row"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="card-icon"><div class="card-info"><div class="card-name">Эпический</div><div class="card-desc">2000 DOGE</div></div></div></div>
            <div class="card" id="caseLegendary"><div class="card-row"><img src="https://cryptologos.cc/logos/dogecoin-doge-logo.png" class="card-icon"><div class="card-info"><div class="card-name">Легендарный</div><div class="card-desc">5000 DOGE</div></div></div></div>
            <button class="btn-close" id="closeCase">Закрыть</button>
        </div>
    </div>

    <div class="modal" id="inventoryModal">
        <div class="modal-content">
            <div class="modal-title">Инвентарь</div>
            <div class="inventory-tabs" style="display:flex;gap:5px;margin-bottom:10px;">
                <button class="tab-btn active" id="tabAvatars" style="flex:1;padding:8px;background:var(--bg-card);border:1px solid var(--border-glass);border-radius:10px;color:var(--text-secondary);cursor:pointer;">Аватары</button>
                <button class="tab-btn" id="tabFrames" style="flex:1;padding:8px;background:var(--bg-card);border:1px solid var(--border-glass);border-radius:10px;color:var(--text-secondary);cursor:pointer;">Рамки</button>
                <button class="tab-btn" id="tabBackgrounds" style="flex:1;padding:8px;background:var(--bg-card);border:1px solid var(--border-glass);border-radius:10px;color:var(--text-secondary);cursor:pointer;">Фоны</button>
            </div>
            <div id="inventoryList"></div>
            <button class="btn-close" id="closeInventory">Закрыть</button>
        </div>
    </div>

    <script>
        // ==================== ЭКРАН ЗАГРУЗКИ ====================
        const loadingScreen = document.getElementById('loadingScreen');
        const gameContainer = document.getElementById('gameContainer');
        
        // ==================== TELEGRAM КНОПКА ====================
        document.getElementById('telegramBtn').addEventListener('click', () => {
            window.open('https://t.me/D0GGZ', '_blank');
        });
        
        // ==================== ПЕРЕМЕННЫЕ ====================
        let score = 0;
        let bones = 0;
        let energy = 100;
        let maxEnergy = 100;
        let tapLevel = 0;
        let energyLevel = 0;
        let autoLevel = 0;
        let evolution = 0;
        let inventory = { avatars: [], frames: [], backgrounds: [] };
        let equipped = { avatar: null, frame: null, background: null };
        let allItems = { avatars: [], frames: [], backgrounds: [] };
        
        const evolutions = ['Baby Doge', 'Doge', 'Golden Doge', 'King Doge', 'Space Doge', 'Moon Doge', 'Diamond Doge'];
        
        const scoreElement = document.getElementById('score');
        const bonesElement = document.getElementById('bones');
        const doge = document.getElementById('doge');
        const energyFill = document.getElementById('energyFill');
        const energyCount = document.getElementById('energyCount');
        const maxEnergyText = document.getElementById('maxEnergyText');
        const evolutionBadge = document.getElementById('evolutionBadge');
        const tapLevelEl = document.getElementById('tapLevel');
        const energyLevelEl = document.getElementById('energyLevel');
        const autoLevelEl = document.getElementById('autoLevel');
        
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        const userId = tg.initDataUnsafe?.user?.id || 'anonymous';
        const username = tg.initDataUnsafe?.user?.username || 'Player';
        
        // ==================== ЗАГРУЗКА ====================
        async function loadState() {
            try {
                const res = await fetch('/api/state/' + userId);
                const data = await res.json();
                
                score = data.score;
                bones = data.bones;
                energy = data.energy;
                maxEnergy = data.maxEnergy;
                tapLevel = data.tapLevel;
                energyLevel = data.energyLevel;
                autoLevel = data.autoLevel;
                evolution = data.evolution;
                inventory = data.inventory;
                equipped = data.equipped;
                
                updateUI();
                loadItems();
                
                // Показать игру и скрыть загрузку
                gameContainer.classList.add('visible');
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                }, 300);
            } catch (err) {
                console.log('Load error:', err);
                gameContainer.classList.add('visible');
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                }, 500);
            }
        }
        
        async function loadItems() {
            try {
                const res = await fetch('/api/items');
                allItems = await res.json();
            } catch (err) {}
        }
        
        function updateUI() {
            scoreElement.textContent = score;
            bonesElement.textContent = bones;
            energyFill.style.width = (energy / maxEnergy * 100) + '%';
            energyCount.textContent = Math.floor(energy);
            maxEnergyText.textContent = maxEnergy;
            tapLevelEl.textContent = tapLevel;
            energyLevelEl.textContent = energyLevel;
            autoLevelEl.textContent = autoLevel;
            evolutionBadge.textContent = evolutions[evolution] || 'Doge';
            updateButtons();
        }
        
        function updateButtons() {
            buyTap.disabled = score < Math.floor(100 * Math.pow(1.15, tapLevel));
            buyTap.textContent = Math.floor(100 * Math.pow(1.15, tapLevel)) + ' DOGE';
            buyEnergy.disabled = score < Math.floor(150 * Math.pow(1.15, energyLevel));
            buyEnergy.textContent = Math.floor(150 * Math.pow(1.15, energyLevel)) + ' DOGE';
            buyAuto.disabled = score < Math.floor(200 * Math.pow(1.15, autoLevel));
            buyAuto.textContent = Math.floor(200 * Math.pow(1.15, autoLevel)) + ' DOGE';
        }
        
        function createFloatingScore(x, y, text) {
            const plus = document.createElement('div');
            plus.textContent = text;
            plus.className = 'floating-score';
            plus.style.left = (x + Math.random() * 20 - 10) + 'px';
            plus.style.top = (y - 20) + 'px';
            document.body.appendChild(plus);
            setTimeout(() => plus.remove(), 900);
        }
        
        function openModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        // ==================== ТАП ====================
        doge.addEventListener('click', async (e) => {
            try {
                const res = await fetch('/api/click', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId })
                });
                const data = await res.json();
                if (data.success) {
                    score = data.score;
                    energy = data.energy;
                    updateUI();
                    createFloatingScore(e.clientX, e.clientY, '+' + data.gain);
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                }
            } catch (err) {}
        });
        
        // ==================== HEARTBEAT ====================
        setInterval(async () => {
            try {
                const res = await fetch('/api/heartbeat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId })
                });
                const data = await res.json();
                if (data.success) {
                    score = data.score;
                    updateUI();
                }
            } catch (err) {}
        }, 10000);
        
        // ==================== ВОССТАНОВЛЕНИЕ ЭНЕРГИИ ====================
        setInterval(async () => {
            try {
                const res = await fetch('/api/state/' + userId);
                const data = await res.json();
                energy = data.energy;
                updateUI();
            } catch (err) {}
        }, 5000);
        
        // ==================== МОДАЛЬНЫЕ ОКНА ====================
        document.getElementById('shopBtn').addEventListener('click', () => { openModal('shopModal'); updateButtons(); });
        document.getElementById('closeShop').addEventListener('click', () => closeModal('shopModal'));
        document.getElementById('leaderboardBtn').addEventListener('click', () => { openModal('leaderboardModal'); loadLeaderboard(); });
        document.getElementById('closeLeaderboard').addEventListener('click', () => closeModal('leaderboardModal'));
        document.getElementById('caseBtn').addEventListener('click', () => openModal('caseModal'));
        document.getElementById('closeCase').addEventListener('click', () => closeModal('caseModal'));
        document.getElementById('inventoryBtn').addEventListener('click', () => { openModal('inventoryModal'); showInventory('avatars'); });
        document.getElementById('closeInventory').addEventListener('click', () => closeModal('inventoryModal'));
        
        // ==================== ПОКУПКИ ====================
        document.getElementById('buyTap').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, upgradeType: 'tap' })
                });
                const data = await res.json();
                if (data.success) {
                    score = data.score;
                    tapLevel = data.tapLevel;
                    updateUI();
                }
            } catch (err) {}
        });
        
        document.getElementById('buyEnergy').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, upgradeType: 'energy' })
                });
                const data = await res.json();
                if (data.success) {
                    score = data.score;
                    energyLevel = data.energyLevel;
                    maxEnergy = data.maxEnergy;
                    updateUI();
                }
            } catch (err) {}
        });
        
        document.getElementById('buyAuto').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, upgradeType: 'auto' })
                });
                const data = await res.json();
                if (data.success) {
                    score = data.score;
                    autoLevel = data.autoLevel;
                    updateUI();
                }
            } catch (err) {}
        });
        
        // ==================== КЕЙСЫ ====================
        document.getElementById('caseCommon').addEventListener('click', () => openCase('common'));
        document.getElementById('caseRare').addEventListener('click', () => openCase('rare'));
        document.getElementById('caseEpic').addEventListener('click', () => openCase('epic'));
        document.getElementById('caseLegendary').addEventListener('click', () => openCase('legendary'));
        
        async function openCase(caseType) {
            try {
                const res = await fetch('/api/case/open', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, caseType })
                });
                const data = await res.json();
                if (data.success) {
                    score = data.newScore;
                    updateUI();
                    alert('Выигрыш: ' + data.dogePrize + ' DOGE!');
                } else {
                    alert(data.error || 'Ошибка');
                }
            } catch (err) {
                alert('Ошибка сети');
            }
        }
        
        // ==================== ИНВЕНТАРЬ ====================
        document.getElementById('tabAvatars').addEventListener('click', () => showInventory('avatars'));
        document.getElementById('tabFrames').addEventListener('click', () => showInventory('frames'));
        document.getElementById('tabBackgrounds').addEventListener('click', () => showInventory('backgrounds'));
        
        function showInventory(category) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab' + category.charAt(0).toUpperCase() + category.slice(1)).classList.add('active');
            
            const list = document.getElementById('inventoryList');
            list.innerHTML = '';
            
            const items = allItems[category] || [];
            const owned = inventory[category] || [];
            
            if (items.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px;">Загрузка...</div>';
                return;
            }
            
            items.forEach(item => {
                const isOwned = owned.includes(item.id);
                const isEquipped = equipped[category] === item.id;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-row">
                        <img src="${item.icon}" class="card-icon">
                        <div class="card-info">
                            <div class="card-name">${item.name}</div>
                            <div class="card-desc">${item.rarity}</div>
                        </div>
                        ${isEquipped ? '<span style="color:#2ecc71;font-weight:bold;">EQUIPPED</span>' : isOwned ? '<button class="btn-buy" id="equip_' + item.id + '">EQUIP</button>' : '<span style="color:#aaa;">🔒</span>'}
                    </div>
                `;
                list.appendChild(card);
                
                if (isOwned && !isEquipped) {
                    document.getElementById('equip_' + item.id).addEventListener('click', async () => {
                        try {
                            const res = await fetch('/api/equip', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ userId, category, itemId: item.id })
                            });
                            const data = await res.json();
                            if (data.success) {
                                equipped = data.equipped;
                                showInventory(category);
                            }
                        } catch (err) {}
                    });
                }
            });
        }
        
        // ==================== ЛИДЕРБОРД ====================
        function loadLeaderboard() {
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px;">Загрузка...</div>';
            fetch('/api/leaderboard')
                .then(res => res.json())
                .then(data => {
                    list.innerHTML = '';
                    if (data.length === 0) {
                        list.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px;">Пока никого нет!</div>';
                        return;
                    }
                    data.forEach((player, index) => {
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `
                            <div class="card-row">
                                <span style="font-weight:bold;color:#f0b90b;">#${index + 1}</span>
                                <span>${player.username}</span>
                                <span style="color:#f0b90b;font-weight:bold;">${player.score} DOGE</span>
                            </div>
                        `;
                        list.appendChild(div);
                    });
                });
        }
        
        // ==================== ЗАПУСК ====================
        loadState();
    </script>
</body>
</html>
